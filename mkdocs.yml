site_name: orderflow-scaling
site_description: Asset-by-asset test of the order-flow / volume / volatility / impact scaling laws on crypto
repo_url: https://github.com/NIDHAL277/orderflow-scaling
theme:
  name: material
  features: [navigation.sections, content.code.copy]
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Compliance with the spec: compliance.md
  - Design decisions (FAQ): design-faq.md
  - Architecture: architecture.md
  - Data: data.md
  - Data sources: data-sources.md
  - Literature watch: literature-watch.md
  - Estimators: estimators.md
  - Forecasting: forecasting.md
  - Change-point monitor: changepoints.md
  - L2 collector: l2-collector.md
  - Second venue (Bybit): venues.md
  - Protocol: protocol.md
  - Operations: operations.md
  - Deploying on Oracle Cloud: deploy-oracle.md
  - Decisions:
      - adr/0001-record-decisions.md
      - adr/0002-versioned-daily-outputs.md
      - adr/0003-causal-seasonal-profile.md
      - adr/0004-additive-daily-statistics.md
      - adr/0005-volatility-horizon-and-estimators.md
      - adr/0006-protocol-state-in-the-image.md
      - adr/0007-daily-files-over-monthly.md
      - adr/0008-h0-variance-and-weighting.md
      - adr/0009-ohlc-check-in-ticks.md
      - adr/0010-catch-up-and-corrections.md
      - adr/0011-five-year-volatility-history.md
      - adr/0012-trade-id-continuity.md
      - adr/0013-forecasting-extension.md
      - adr/0014-l2-collector.md
      - adr/0015-volume-centred-order-flow.md
  - Incidents:
      - incidents/README.md
      - incidents/2026-11-09-manifest-late-null-column.md
      - incidents/2026-11-09-perpetual-klines-without-trades.md
      - incidents/2026-11-09-network-error-labelled-delisted.md
      - incidents/2026-11-09-futures-kline-open-convention.md
      - incidents/2026-11-09-universe-build-without-retries.md
