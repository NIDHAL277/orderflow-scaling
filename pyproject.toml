[project]
name = "orderflow-scaling"
version = "0.1.0"
description = "Asset-by-asset test, on Binance crypto data, of the order-flow / volume / volatility / impact scaling laws of Muhle-Karbe, Ouazzani Chahdi, Rosenbaum & Szymanski (2026)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nidhal.V" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "polars>=1.20",
    "duckdb>=1.1",
    "numba>=0.61",
    "statsmodels>=0.14.4",
    "arch>=7.2",
    "pandera[polars]>=0.22",
    "httpx>=0.28",
    "truststore>=0.10",
    "tenacity>=9.0",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.10",
    "pyyaml>=6.0.2",
    "structlog>=25.1",
    "matplotlib>=3.10",
    "streamlit>=1.42",
    "websockets>=15",
]

[project.scripts]
ofs = "ofs.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-benchmark>=5.1",
    "hypothesis>=6.125",
    "ruff>=0.9",
    "mypy>=1.15",
    "pip-audit>=2.8",
    "mkdocs-material>=9.6",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ofs"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- lint / format
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY", "RUF", "PT", "PTH", "PIE", "RET", "D"]
ignore = [
    "E501",    # long lines are left to the formatter
    "RUF001",  # Greek letters (tau, sigma, epsilon) are intentional in math code
    "RUF002",
    "RUF003",
    "PTH123",  # open() is fine next to explicit encodings
    "RET504",
    "D105",    # magic methods follow their protocol
    "D107",    # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"  # spec §10: NumPy docstrings on the package

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "PT018", "D"]  # compound asserts read better in numeric tests
"scripts/**" = ["D"]
"dashboards/**" = ["D"]
# Numba nopython kernels can only use the legacy np.random API
"src/ofs/simulate/hawkes.py" = ["NPY002"]
"src/ofs/simulate/signs.py" = ["NPY002"]

# ---------------------------------------------------------------- typing
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/ofs"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["numba", "numba.*", "scipy", "scipy.*", "statsmodels", "statsmodels.*", "arch", "arch.*", "pandera", "pandera.*", "streamlit", "streamlit.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers -m 'not slow and not network'"
markers = [
    "slow: long simulation or benchmark tests (weekly CI)",
    "network: needs internet access to data.binance.vision",
]
filterwarnings = [
    "ignore::DeprecationWarning:pandera.*",
]

[tool.coverage.run]
source = ["ofs"]
branch = true
omit = ["*/ofs/report/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@overload",
]
